<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifrəni unutmusunuz | Cake Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body data-page="forgot">
<main class="section">
    <div class="container">
        <div class="card" style="max-width:480px;margin:0 auto">
            <div class="status-icon status-icon--info"><i class="fa fa-key"></i></div>
            <h1 style="font-size:32px;text-align:center">Şifrəni unutmusunuz?</h1>
            <p class="muted" style="text-align:center;margin-bottom:24px">E-poçtunuzu yazın, şifrəni yeniləmək üçün sizə link göndərək.</p>
            <form id="forgotForm" class="auth-form" novalidate>
                <div class="alert" data-alert role="alert"></div>
                <div class="field">
                    <label for="fpEmail">E-poçt</label>
                    <input id="fpEmail" class="input" type="email" autocomplete="email" autofocus>
                    <div class="field-error"></div>
                </div>
                <button type="submit" class="btn btn--primary btn--block">Link göndər</button>
                <p class="auth-switch"><a href="login.html"><i class="fa fa-arrow-left"></i> Girişə qayıt</a></p>
            </form>
        </div>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
