<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qeydiyyat | Cake Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body data-page="register">
<main class="auth-wrap">
    <div class="container">
        <div class="auth-card">
            <div class="auth-card__visual" style="background-image:url('img/hero/hero-1.jpg')">
                <h2>Cake Shop-a qoşulun</h2>
                <p>Onlayn sifariş vermək, seçilmişlərinizi saxlamaq və çatdırılmanı izləmək üçün hesab yaradın.</p>
            </div>
            <div class="auth-card__form">
                <h1>Hesab yarat</h1>
                <p class="sub">Cəmi bir dəqiqə çəkir.</p>
                <form id="registerForm" class="auth-form" novalidate>
                    <div class="alert" data-alert role="alert"></div>
                    <div class="field">
                        <label for="regName">Ad soyad</label>
                        <input id="regName" class="input" autocomplete="name" autofocus>
                        <div class="field-error"></div>
                    </div>
                    <div class="form-grid">
                        <div class="field">
                            <label for="regUser">İstifadəçi adı</label>
                            <input id="regUser" class="input" autocomplete="username">
                            <div class="field-error"></div>
                        </div>
                        <div class="field">
                            <label for="regEmail">E-poçt</label>
                            <input id="regEmail" class="input" type="email" autocomplete="email">
                            <div class="field-error"></div>
                        </div>
                    </div>
                    <div class="field">
                        <label for="regPass">Şifrə</label>
                        <div class="input-wrap">
                            <input id="regPass" class="input" type="password" autocomplete="new-password">
                            <button type="button" class="toggle-pass" data-toggle-pass aria-label="Şifrəni göstər"><i class="fa fa-eye"></i></button>
                        </div>
                        <div class="strength" data-strength aria-hidden="true"><span></span><span></span><span></span><span></span></div>
                        <ul class="rules" data-rules></ul>
                        <div class="field-error"></div>
                    </div>
                    <div class="field">
                        <label for="regPass2">Şifrəni təkrarlayın</label>
                        <div class="input-wrap">
                            <input id="regPass2" class="input" type="password" autocomplete="new-password">
                            <button type="button" class="toggle-pass" data-toggle-pass aria-label="Şifrəni göstər"><i class="fa fa-eye"></i></button>
                        </div>
                        <div class="field-error"></div>
                    </div>
                    <button type="submit" class="btn btn--primary btn--block">Hesab yarat</button>
                    <p class="auth-switch">Artıq hesabınız var? <a href="login.html">Daxil olun</a></p>
                </form>
            </div>
        </div>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
