<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Əlaqə | Cake Shop</title>
    <meta name="description" content="Cake Shop ilə əlaqə saxlayın.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body data-page="contact">
<main>
    <section class="page-hero">
        <div class="container">
            <nav class="breadcrumb" aria-label="Naviqasiya"><a href="index.html">Ana səhifə</a><span>Əlaqə</span></nav>
            <h1 data-contact-title>Bizimlə əlaqə</h1>
        </div>
    </section>

    <section class="section--tight">
        <div class="container">
            <div class="contact-grid">
                <div class="info-cards">
                    <div class="info-card">
                        <i class="fa fa-phone" aria-hidden="true"></i>
                        <div><strong>Zəng edin</strong><a class="muted" data-phone href="#">—</a></div>
                    </div>
                    <div class="info-card">
                        <i class="fa fa-clock-o" aria-hidden="true"></i>
                        <div><strong>İş saatları</strong><small>Hər gün, 08:00 – 21:00</small></div>
                    </div>
                    <div class="info-card">
                        <i class="fa fa-truck" aria-hidden="true"></i>
                        <div><strong>Çatdırılma</strong><small>Saat 14:00-dək sifarişlərə eyni gün</small></div>
                    </div>
                </div>

                <form class="card" data-contact-form novalidate>
                    <h2 style="font-size:28px">Bizə yazın</h2>
                    <p class="muted" style="margin-bottom:22px">Suallar, xüsusi tort sifarişləri və ya rəyləriniz — hər mesajı oxuyuruq.</p>
                    <div class="form-grid">
                        <div class="field">
                            <label for="ctName">Ad</label>
                            <input id="ctName" class="input" autocomplete="name" maxlength="20">
                        </div>
                        <div class="field">
                            <label for="ctEmail">E-poçt</label>
                            <input id="ctEmail" class="input" type="email" autocomplete="email">
                        </div>
                        <div class="field full">
                            <label for="ctMessage">Mesaj</label>
                            <textarea id="ctMessage" class="textarea" maxlength="200"></textarea>
                        </div>
                        <div class="full"><div class="alert" data-alert role="alert"></div></div>
                    </div>
                    <button type="submit" class="btn btn--primary" style="margin-top:20px"><i class="fa fa-paper-plane"></i> Mesajı göndər</button>
                </form>
            </div>

            <iframe class="map-frame" title="Xəritə" loading="lazy"
                src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d10784.188505644011!2d19.053119335158936!3d47.48899529453826!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sbd!4v1543907528304"
                allowfullscreen></iframe>
        </div>
    </section>
</main>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/site.js"></script>
</body>
</html>
