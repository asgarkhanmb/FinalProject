<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daxil ol | Cake Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body data-page="login">
<main class="auth-wrap">
    <div class="container">
        <div class="auth-card">
            <div class="auth-card__visual" style="background-image:url('img/hero/hero-2.jpeg')">
                <h2>Yenidən xoş gəldiniz</h2>
                <p>Sifarişlərinizi izləmək, sevimlilərinizi saxlamaq və daha sürətli ödəmək üçün daxil olun.</p>
            </div>
            <div class="auth-card__form">
                <h1>Daxil ol</h1>
                <p class="sub">Sizi yenidən görməyə şadıq.</p>
                <form id="loginForm" class="auth-form" novalidate>
                    <div class="alert" data-alert role="alert"></div>
                    <div class="field">
                        <label for="loginId">İstifadəçi adı və ya e-poçt</label>
                        <input id="loginId" class="input" autocomplete="username" autofocus>
                        <div class="field-error"></div>
                    </div>
                    <div class="field">
                        <label for="loginPass">Şifrə</label>
                        <div class="input-wrap">
                            <input id="loginPass" class="input" type="password" autocomplete="current-password">
                            <button type="button" class="toggle-pass" data-toggle-pass aria-label="Şifrəni göstər"><i class="fa fa-eye"></i></button>
                        </div>
                        <div class="field-error"></div>
                    </div>
                    <div class="auth-row">
                        <span></span>
                        <a href="forgot-password.html">Şifrəni unutmusunuz?</a>
                    </div>
                    <button type="submit" class="btn btn--primary btn--block">Daxil ol</button>
                    <p class="auth-switch">Hesabınız yoxdur? <a href="register.html">Hesab yaradın</a></p>
                </form>
            </div>
        </div>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
