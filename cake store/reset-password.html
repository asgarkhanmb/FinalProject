<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni şifrə | Cake Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body data-page="reset">
<main class="section">
    <div class="container">
        <div class="card" style="max-width:480px;margin:0 auto">
            <div class="status-icon status-icon--info"><i class="fa fa-lock"></i></div>
            <h1 style="font-size:32px;text-align:center">Yeni şifrə təyin edin</h1>
            <p class="muted" style="text-align:center;margin-bottom:24px">Əvvəl istifadə etmədiyiniz güclü şifrə seçin.</p>
            <form id="resetForm" class="auth-form" novalidate>
                <div class="alert" data-alert role="alert"></div>
                <div class="field">
                    <label for="rpPass">Yeni şifrə</label>
                    <div class="input-wrap">
                        <input id="rpPass" class="input" type="password" autocomplete="new-password" autofocus>
                        <button type="button" class="toggle-pass" data-toggle-pass aria-label="Şifrəni göstər"><i class="fa fa-eye"></i></button>
                    </div>
                    <div class="strength" data-strength aria-hidden="true"><span></span><span></span><span></span><span></span></div>
                    <ul class="rules" data-rules></ul>
                    <div class="field-error"></div>
                </div>
                <div class="field">
                    <label for="rpPass2">Şifrəni təkrarlayın</label>
                    <div class="input-wrap">
                        <input id="rpPass2" class="input" type="password" autocomplete="new-password">
                        <button type="button" class="toggle-pass" data-toggle-pass aria-label="Şifrəni göstər"><i class="fa fa-eye"></i></button>
                    </div>
                    <div class="field-error"></div>
                </div>
                <button type="submit" class="btn btn--primary btn--block">Şifrəni yadda saxla</button>
            </form>
        </div>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
