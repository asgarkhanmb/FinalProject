<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mağaza | Cake Shop</title>
    <meta name="description" content="Tortlarımız, kekslərimiz və şirniyyatlarımız.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body data-page="shop">
<main>
    <section class="page-hero">
        <div class="container">
            <nav class="breadcrumb" aria-label="Naviqasiya"><a href="index.html">Ana səhifə</a><span>Mağaza</span></nav>
            <h1>Tortlarımız</h1>
        </div>
    </section>

    <section class="section--tight">
        <div class="container">
            <div class="shop-toolbar">
                <form class="search-field" data-shop-search role="search">
                    <i class="fa fa-search" aria-hidden="true"></i>
                    <label for="shopSearch" class="sr-only">Məhsul axtar</label>
                    <input id="shopSearch" type="search" placeholder="Tort axtarın və Enter basın">
                </form>
                <label for="shopSort" class="sr-only">Sırala</label>
                <select id="shopSort" class="select">
                    <option value="">Sıralama: Tövsiyə olunan</option>
                    <option value="price|asc">Qiymət: ucuzdan bahaya</option>
                    <option value="price|desc">Qiymət: bahadan ucuza</option>
                    <option value="name|asc">Ad: A–Z</option>
                    <option value="name|desc">Ad: Z–A</option>
                </select>
            </div>
            <div class="chips" data-chips role="toolbar" aria-label="Kateqoriyalar"></div>
            <p class="result-count" data-count aria-live="polite"></p>
            <div class="product-grid" data-products></div>
            <nav class="pagination" data-pagination aria-label="Səhifələr"></nav>
        </div>
    </section>
</main>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/site.js"></script>
</body>
</html>
